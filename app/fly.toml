# fly.toml app configuration file generated for vido-ai-backend
app = "vido-ai-backend"
primary_region = "fra"  # Frankfurt - Türkiye'ye en yakın
kill_signal = "SIGINT"
kill_timeout = "5s"

[experimental]
  auto_rollback = true

[env]
  PORT = "8000"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    method = "GET"
    path = "/health"
    protocol = "http"
    timeout = "10s"
    interval = "30s"
    grace_period = "5s"

[deploy]
  release_command = "echo 'Deployment complete'"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1 