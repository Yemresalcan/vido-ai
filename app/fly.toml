# fly.toml app configuration file generated for vido-ai on 2025-07-09T23:03:22Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'vido-ai'
primary_region = 'fra'

[build]

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
