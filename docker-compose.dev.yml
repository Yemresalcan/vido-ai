version: '3.8'

services:
  backend:
    build: 
      context: ./app
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    env_file:
      - ./app/.env
    volumes:
      - ./app:/app
      - /app/venv
    restart: unless-stopped
    command: python vido_api.py

  frontend:
    build:
      context: ./vido-site
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NODE_ENV=development
    volumes:
      - ./vido-site:/app
      - /app/node_modules
      - /app/.next
    restart: unless-stopped

networks:
  default:
    name: vido-ai-dev-network 