[experimental]
  auto_rollback = true

[env]
  PORT = "8080"
  NODE_ENV = "production"
  NEXT_TELEMETRY_DISABLED = "1"
=======
app = 'vido-ai-web'
primary_region = 'fra'


[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
