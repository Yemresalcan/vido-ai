# fly.toml app configuration file generated for vido-ai-web on 2025-07-10T11:35:38Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'vido-ai-web'
primary_region = 'fra'
kill_signal = "SIGINT"
kill_timeout = "5s"

[experimental]
  auto_rollback = true

[env]
  PORT = "8080"
  NODE_ENV = "production"
  NEXT_TELEMETRY_DISABLED = "1"

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/"

[deploy]
  release_command = "npm run build"

[[vm]]
  memory_mb = 1024
  cpu_kind = 'shared'
  cpus = 1

[[statics]]
  guest_path = "/app/.next/static"
  url_prefix = "/_next/static/"
