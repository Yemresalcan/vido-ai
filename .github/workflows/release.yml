name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Generate Release Notes
      id: generate_notes
      run: |
        # Extract version from tag
        VERSION=${GITHUB_REF#refs/tags/v}
        echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
        
        # Generate release notes from CHANGELOG
        sed -n "/## \[$VERSION\]/,/## \[/p" CHANGELOG.md | sed '$ d' > release_notes.md
        
        # If no specific notes found, use latest unreleased
        if [ ! -s release_notes.md ]; then
          sed -n "/## \[Unreleased\]/,/## \[/p" CHANGELOG.md | sed '$ d' > release_notes.md
        fi
        
        echo "Generated release notes for version $VERSION"
        
    - name: Create Release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref }}
        release_name: Vido AI v${{ steps.generate_notes.outputs.VERSION }}
        body_path: release_notes.md
        draft: false
        prerelease: false

  docker-build:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    needs: release
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
        
    - name: Extract version
      id: extract_version
      run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
      
    - name: Build and push Backend
      uses: docker/build-push-action@v5
      with:
        context: ./app
        file: ./app/Dockerfile
        push: true
        tags: |
          yemresalcan/vido-ai-backend:latest
          yemresalcan/vido-ai-backend:${{ steps.extract_version.outputs.VERSION }}
          
    - name: Build and push Frontend
      uses: docker/build-push-action@v5
      with:
        context: ./vido-site
        file: ./vido-site/Dockerfile
        push: true
        tags: |
          yemresalcan/vido-ai-frontend:latest
          yemresalcan/vido-ai-frontend:${{ steps.extract_version.outputs.VERSION }} 